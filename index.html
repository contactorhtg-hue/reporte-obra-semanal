<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#172554"><meta name="description" content="Reporte profesional de actividades de construcción">
<link rel="manifest" href="./public/manifest.webmanifest"><link rel="icon" href="./public/icon.svg"><title>Reporte de Obra v2.1</title>
<style>
:root{--navy:#172554;--navy2:#0f172a;--blue:#2563eb;--amber:#f59e0b;--green:#059669;--red:#dc2626;--bg:#eef2f7;--card:#fff;--line:#d7dee8;--muted:#64748b;--text:#172033}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:88px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:960px;margin:auto}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:12px 14px env(safe-area-inset-top);box-shadow:0 5px 18px #0f172a30}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--amber);display:grid;place-items:center;color:var(--navy);font-weight:950}.brand h1{font-size:16px;margin:0}.brand small{display:block;color:#cbd5e1;font-size:10px;margin-top:2px}.actions{display:flex;gap:6px}.icon{background:#ffffff12;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:8px 10px;min-width:38px}
main{padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0f172a08}.title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.title h2{font-size:15px;margin:0}.tag{background:#e0e7ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:850}.sub{font-size:11px;color:var(--muted);line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:850;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px 11px;color:var(--text);outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #2563eb15}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;overflow:auto}.day{min-width:43px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:8px 3px;text-align:center;color:#475569}.day b{display:block;font-size:9px}.day span{font-size:10px}.day.active{background:var(--navy);border-color:var(--navy);color:#fff}.day.done{position:relative}.day.done:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--green);right:4px;top:4px}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}.dayhead h2{margin:0;font-size:19px}.dayhead p{margin:3px 0 0;font-size:11px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:850}.primary{background:var(--blue);color:#fff}.dark{background:var(--navy2);color:#fff}.light{background:#e2e8f0;color:#172033}.green{background:var(--green);color:#fff}.danger{background:#fee2e2;color:#991b1b}.small{padding:6px 8px;font-size:10px}.meter{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue);width:0}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f8fafc}.preview{aspect-ratio:4/3;position:relative;background:#e2e8f0;display:grid;place-items:center;color:#94a3b8;font-size:26px}.preview img{width:100%;height:100%;object-fit:cover}.num{position:absolute;left:6px;top:6px;background:#0f172acc;color:#fff;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800}.photo-body{padding:8px}.photo-body textarea{width:100%;min-height:58px;border:1px solid #cbd5e1;border-radius:8px;padding:7px;font-size:11px;resize:vertical}.photo-foot{display:flex;justify-content:space-between;gap:5px;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:18px;font-size:11px;border:1px dashed #cbd5e1;border-radius:10px}.sticky{position:fixed;z-index:40;bottom:0;left:0;right:0;background:#ffffffef;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px max(10px,env(safe-area-inset-left)) max(9px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.sticky .btn{flex:1;max-width:310px}.toast{position:fixed;z-index:80;left:50%;bottom:86px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:9px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.status{font-size:10px;color:#cbd5e1;margin-top:3px}.required{border-color:#f59e0b!important}.hidden{display:none!important}.summary-box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:#334155}.checkrow{display:flex;gap:12px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:5px;font-size:11px}.check input{accent-color:var(--blue)}
@media(min-width:720px){main{padding:20px}.photos{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="app"><header><div class="top"><div class="brand"><div class="logo">RO</div><div><h1>Reporte de Obra · v2.1</h1><small>Supervisión · bitácora · evidencia fotográfica</small></div></div><div class="actions"><button class="icon" id="backupBtn" title="Respaldar">⇩</button><button class="icon" id="restoreBtn" title="Restaurar">⇧</button><button class="icon" id="newBtn" title="Nuevo reporte">＋</button><button class="icon" id="clearBtn" title="Borrar">⌫</button></div></div></header><main id="main"></main></div>
<div class="sticky"><button class="btn green" id="saveBtn">✓ Guardar</button><button class="btn primary" id="exportBtn">▣ Generar Excel</button></div><div class="toast" id="toast"></div>
<input id="camera" type="file" accept="image/*" capture="environment" class="hidden"><input id="gallery" type="file" accept="image/*" multiple class="hidden"><input id="restoreFile" type="file" accept="application/json,.json" class="hidden">
<script type="module" src="./src/main.js"></script></body></html>
